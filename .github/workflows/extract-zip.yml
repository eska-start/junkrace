name: Extract uploaded ZIP

on:
  push:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract ZIP into repository
        run: |
          set -e
          ZIP="./- (2).zip"
          if [ -f "$ZIP" ]; then
            unzip -q -o "$ZIP" -d .
            rm -f "$ZIP"
          fi
          rm -rf .__zipchunks .__zip500 EXTRACT_TRIGGER
          rm -f .github/workflows/extract-zip.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Extract uploaded ZIP"
          git push
