name: Extract uploaded ZIP

on:
  push:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract ZIP
        run: |
          set -e
          if [ -f '- (2).zip' ]; then
            unzip -q -o '- (2).zip' -d .
            rm -f '- (2).zip'
          fi
          rm -f '.github/workflows/extract-zip.yml' 'EXTRACT_TRIGGER'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0 || true
          git commit -m "Extract uploaded ZIP"
          git push
